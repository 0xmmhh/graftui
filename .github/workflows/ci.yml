name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build graftui.slnx
      - name: Test
        run: dotnet test graftui.slnx --no-build --logger "console;verbosity=normal"

  # macOS runs only when started by hand (Actions tab → CI → Run workflow): it takes several minutes, and development
  # already happens on macOS with the full test run before each pull request.
  build-and-test-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build graftui.slnx
      - name: Test
        run: dotnet test graftui.slnx --no-build --logger "console;verbosity=normal"

  # Windows runs only when started by hand (Actions tab → CI → Run workflow)
  # until the Windows fixes are in; some tests still fail there.
  windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build graftui.slnx
      - name: Test
        run: dotnet test graftui.slnx --no-build --logger "console;verbosity=normal"
