name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build graftui.slnx
      - name: Test
        run: dotnet test graftui.slnx --no-build --logger "console;verbosity=normal"

  # Windows runs only when started by hand (Actions tab → CI → Run workflow)
  # until the Windows fixes are in; some tests still fail there.
  windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build graftui.slnx
      - name: Test
        run: dotnet test graftui.slnx --no-build --logger "console;verbosity=normal"

  # Builds, runs the tests with coverage and sends both to SonarCloud.
  # Pull requests from forks get no secrets, so they skip this job.
  sonar:
    if: >-
      github.ref_type != 'tag' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar needs the full history to tell new code from old.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install Sonar scanner
        run: dotnet tool install --global dotnet-sonarscanner --version 11.3.0
      - name: Start analysis
        run: >-
          dotnet sonarscanner begin
          /k:"0xmmhh_graft"
          /o:"0xmmhh"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml"
      - name: Build
        run: dotnet build graftui.slnx
      - name: Test with coverage
        run: >-
          dotnet test graftui.slnx --no-build
          --collect "XPlat Code Coverage"
          --results-directory coverage
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
      - name: Send analysis
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
