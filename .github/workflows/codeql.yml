name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 06:00 UTC: new queries also run on code that has not changed.
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  analyze:
    name: CodeQL (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Manual build mode: CodeQL watches the real build, so the C# is analysed as it compiles.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - name: Build
        run: dotnet build graftui.slnx
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
