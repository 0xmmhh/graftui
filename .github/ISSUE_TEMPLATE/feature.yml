name: Feature request
description: Suggest something graftui could do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, in your own words. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like graftui to do?
      description: Keys, screens or git commands you have in mind, if any.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
