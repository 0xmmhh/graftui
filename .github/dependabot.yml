version: 2

updates:
  # One grouped pull request per ecosystem each week, so a week's updates are reviewed together.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "Deps"
    groups:
      nuget:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "Deps"
    groups:
      github-actions:
        patterns:
          - "*"
